<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Undangan Pernikahan Online"
  >

  <title>Undangan Pernikahan</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- LOADING -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
      <div class="loader"></div>
      <p>Memuat undangan...</p>
    </div>
  </div>


  <!-- MAIN -->
  <main id="app" class="app hidden">

    <!-- HERO -->
    <section class="hero">

      <div class="overlay"></div>

      <div class="hero-content">

        <p class="small-title">
          THE WEDDING OF
        </p>

        <h1 id="namaPengantin">
          Loading...
        </h1>

        <p id="tanggalAcara" class="date">
          -
        </p>

        <button
          id="openInvitation"
          class="btn-primary"
        >
          Buka Undangan
        </button>

      </div>

    </section>


    <!-- CONTENT -->
    <section class="content">

      <div class="container">

        <div class="section-card">

          <p class="section-label">
            WEDDING INVITATION
          </p>

          <h2 id="namaPria">
            -
          </h2>

          <span class="and">
            &
          </span>

          <h2 id="namaWanita">
            -
          </h2>

          <p id="lokasiAcara" class="location">
            -
          </p>

        </div>


        <div class="section-card">

          <h3>
            Terima Kasih
          </h3>

          <p>
            Dengan penuh kebahagiaan, kami mengundang
            Anda untuk hadir dan memberikan doa restu
            pada hari bahagia kami.
          </p>

        </div>

      </div>

    </section>

  </main>


  <!-- ERROR -->
  <div id="errorScreen" class="error-screen hidden">

    <div class="error-box">

      <h2>
        Terjadi Kesalahan
      </h2>

      <p id="errorMessage">
        Data undangan tidak dapat dimuat.
      </p>

      <button
        onclick="location.reload()"
        class="btn-primary"
      >
        Coba Lagi
      </button>

    </div>

  </div>


  <script src="js/app.js"></script>

</body>

</html>
